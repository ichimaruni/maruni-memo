        --color-red-50: #fdeeee;
        --color-red-100: #ffdada;
        --color-red-200: #ffbbbb;
        --color-red-300: #ff9696;
        --color-red-400: #ff7171;
        --color-red-500: #ff5454;
        --color-red-600: #fe3939;
        --color-red-700: #fa0000;
        --color-red-800: #ec0000;
        --color-red-900: #ce0000;
        --color-red-1000: #a90000;
        --color-red-1100: #850000;
        --color-red-1200: #620000;

        --color-magenta-50: #f3e5f4;
        --color-magenta-100: #ffd0ff;
        --color-magenta-200: #ffaeff;
        --color-magenta-300: #ff8eff;
        --color-magenta-400: #f661f6;
        --color-magenta-500: #f137f1;
        --color-magenta-600: #db00db;
        --color-magenta-700: #c000c0;
        --color-magenta-800: #aa00aa;
        --color-magenta-900: #8b008b;
        --color-magenta-1000: #6c006c;
        --color-magenta-1100: #500050;
        --color-magenta-1200: #3b003b;

        --color-purple-50: #f1eafa;
        --color-purple-100: #ecddff;
        --color-purple-200: #ddc2ff;
        --color-purple-300: #cda6ff;
        --color-purple-400: #bb87ff;
        --color-purple-500: #a565f8;
        --color-purple-600: #8843e1;
        --color-purple-700: #6f23d0;
        --color-purple-800: #5c10be;
        --color-purple-900: #5109ad;
        --color-purple-1000: #41048e;
        --color-purple-1100: #30016c;
        --color-purple-1200: #21004b;

        --color-white: #ffffff;
        --color-black: #000000;
        --color-gray-50: #f2f2f2;
        --color-gray-100: #e6e6e6;
        --color-gray-200: #cccccc;
        --color-gray-300: #b3b3b3;
        --color-gray-400: #999999;
        --color-gray-420: #949494;
        --color-gray-500: #7f7f7f;
        --color-gray-536: #767676;
        --color-gray-600: #666666;
        --color-gray-700: #4d4d4d;
        --color-gray-800: #333333;
        --color-gray-900: #1a1a1a;

        --font-family-sans:
          "BIZ UDPGothic", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo,
          sans-serif;
        --font-weight-regular: 400;
        --font-weight-bold: 700;
        --font-size-xs: 12px;
        --font-size-sm: 14px;
        --font-size-md: 16px;
        --font-size-lg: 20px;
        --font-size-xl: 24px;
        --font-size-2xl: 32px;
        --font-size-display: 40px;
        --line-height-heading: 1.4;
        --line-height-body: 1.7;
        --line-height-note: 1.5;

        --space-1: 8px;
        --space-2: 16px;
        --space-3: 24px;
        --space-4: 32px;
        --space-5: 40px;
        --space-6: 48px;
        --space-8: 64px;

        --radius-none: 0;
        --radius-small: 8px;
        --radius-medium: 16px;
        --radius-full: 9999px;

        --elevation-0: none;
        --elevation-1: 0 2px 8px rgba(0, 0, 0, 0.12);
        --elevation-2: 0 8px 24px rgba(0, 0, 0, 0.16);
      }

      /* Board roles: neutral workspace, black content, purple interaction state. */
      :root {
        --board-bg: color-mix(
          in srgb,
          var(--color-white) 55%,
          var(--color-gray-50)
        );
        --surface: var(--color-white);
        --ink: var(--color-black);
        --muted: var(--color-gray-600);
        --control-border: var(--color-gray-420);
        --focus: var(--color-purple-700);
        --active-bg: var(--color-purple-50);
        --active-ink: var(--color-purple-800);
        --note-font:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        font-family: var(--note-font);
        color: var(--ink);
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--board-bg);
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button svg {
        pointer-events: none;
      }
      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
      }
      #world [data-id] {
        cursor: grab;
      }
      #world foreignObject {
        cursor: text;
      }
      .note-content,
      #editor {
        padding: 16px;
        font: 16px/1.6 var(--note-font);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .selection {
        pointer-events: none;
      }
      body.dragging,
      body.dragging * {
        cursor: grabbing !important;
      }

      /* Text and fit are the primary actions; remaining tools are compact. */
      .dock {
        position: absolute;
        z-index: 10;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 24px);
      }
      .toolbar,
      .zoom,
      #formatbar {
        background: var(--surface);
        border: 1px solid var(--control-border);
        border-radius: 12px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        box-shadow: var(--elevation-1);
      }
      .primary-tools,
      .secondary-tools {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .primary-tools {
        gap: 8px;
      }
      .tool {
        display: grid;
        place-items: center;
        width: 36px;
        height: 44px;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .tool svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tool:hover:not(:disabled),
      .zoom button:hover,
      #new:hover {
        background: var(--color-gray-50);
      }
      .tool.active,
      #formatbar button[aria-pressed="true"] {
        background: var(--active-bg);
        color: var(--active-ink);
      }
      .tool.primary-tool,
      .quick-action {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: auto;
        height: 48px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .tool.primary-tool {
        min-width: 120px;
        background: var(--color-purple-700);
        color: var(--color-white);
      }
      .tool.primary-tool:hover,
      .tool.primary-tool.active {
        background: var(--color-purple-800);
        color: var(--color-white);
      }
      .quick-action svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #home {
        min-width: 112px;
        background: var(--active-bg);
        color: var(--active-ink);
      }
      #home:hover {
        background: var(--color-purple-100);
      }
      #new {
        padding: 0 10px;
        font-size: 13px;
        height: 44px;
      }
      .divider {
        height: 24px;
        width: 1px;
        background: var(--color-gray-200);
        margin: 0 4px;
        flex-shrink: 0;
      }
      .palette {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 4px;
      }
      .swatch {
        width: 22px;
        height: 22px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        flex-shrink: 0;
      }
      .swatch.active {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      .zoom {
        position: absolute;
        z-index: 10;
        bottom: calc(100% + 8px);
        right: 0;
        display: flex;
        align-items: center;
        padding: 2px;
        color: var(--color-gray-700);
        border-color: var(--color-gray-200);
        border-radius: 8px;
      }
      .zoom button {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        font-size: 16px;
      }
      .zoom span {
        width: 40px;
        text-align: center;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      /* Screen-space overlays keep border hit areas usable at every zoom. */
      #grab-layer,
      #component-actions {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 6;
        overflow: hidden;
      }
      #grab-layer line {
        pointer-events: stroke;
        cursor: grab;
      }
      .duplicate-button {
        position: absolute;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        pointer-events: auto;
        border: 1px solid var(--control-border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }
      .duplicate-button:hover {
        background: var(--active-bg);
        color: var(--active-ink);
      }
      .duplicate-button:active {
        background: var(--color-purple-100);
        color: var(--active-ink);
      }
      .duplicate-button svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #editor {
        position: absolute;
        display: none;
        min-height: 65px;
        overflow: auto;
        border: 2px solid var(--focus);
        border-radius: 8px;
        padding: 14px;
        outline: none;
        transform-origin: top left;
        z-index: 5;
      }
      #formatbar {
        display: none;
        position: absolute;
        z-index: 8;
        gap: 4px;
        padding: 4px;
        box-shadow: var(--elevation-1);
      }
      #formatbar button {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        font-size: 14px;
      }
      #formatbar button:hover {
        background: var(--active-bg);
        color: var(--active-ink);
      }
      #world [data-highlight],
      #editor [style*="background-color: rgb(255, 212, 61)"],
      #editor [style*="background-color: rgb(255, 228, 120)"] {
        color: var(--ink) !important;
      }
      #world [data-highlight] {
        background: var(--color-yellow-300) !important;
      }
      #toast {
        display: none;
        position: absolute;
        z-index: 20;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--surface);
        font-size: 13px;
      }
      @media (max-width: 760px) {
        .dock {
          bottom: 16px;
          max-width: calc(100% - 16px);
        }
        .toolbar {
          flex-direction: column;
          gap: 8px;
        }
        .primary-tools {
          width: 100%;
        }
        .primary-tools > * {
          flex: 1;
        }
      }
      @media (max-width: 390px) {
        .toolbar {
          padding: 6px;
        }
        .secondary-tools {
          gap: 2px;
        }
        .tool {
          width: 32px;
        }
        .palette {
          gap: 7px;
        }
        .swatch {
          width: 20px;
          height: 20px;
        }
        .divider {
          margin: 0 2px;
        }
        #new {
          padding: 0 6px;
          gap: 4px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition:
            background-color 0.12s,
            color 0.12s;
        }
      }
    </style>
  </head>
  <body>
    <svg id="canvas" aria-label="メモボード">
      <defs>
        <marker
          id="arrowhead"
          viewBox="0 0 10 10"
          refX="10"
          refY="5"
          markerWidth="14"
          markerHeight="14"
          markerUnits="userSpaceOnUse"
          orient="auto-start-reverse"
        >
          <path
            d="M 0 0 L 10 5 L 0 10 Z"
            fill="var(--color-black)"
          />
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="var(--board-bg)" />
      <g id="world"></g>
    </svg>

    <svg id="grab-layer" aria-hidden="true"></svg>
    <div id="component-actions" aria-label="各メモの操作"></div>

    <div class="dock">
      <nav class="toolbar" aria-label="描画ツール">
        <div class="primary-tools">
          <button
            class="tool primary-tool"
            data-tool="text"
            title="テキスト (T)"
            aria-label="テキスト"
          >
            <svg viewBox="0 0 24 24">
              <path d="M5 6V4h14v2M12 4v16M8 20h8" />
            </svg>
            <span>テキスト</span></button
          ><button
            id="home"
            class="quick-action"
            title="全体を表示（Shift+1）"
            aria-label="全体を表示"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></svg
            ><span>全体表示</span>
          </button>
        </div>
        <div class="secondary-tools">
          <button
            class="tool active"
            data-tool="select"
            title="選択・移動 (V)"
            aria-label="選択・移動"
          >
            <svg viewBox="0 0 24 24">
              <path d="m6 3 13 10-7 1-3 7z" />
            </svg></button
          ><button
            class="tool"
            data-tool="rect"
            title="四角 (R)"
            aria-label="四角"
          >
            <svg viewBox="0 0 24 24">
              <rect x="4" y="4" width="16" height="16" rx="1" />
            </svg></button
          ><button
            class="tool"
            data-tool="arrow"
            title="矢印 (A)"
            aria-label="矢印"
          >
            <svg viewBox="0 0 24 24"><path d="M4 20 20 4M8 4h12v12" /></svg>
          </button>
          <div class="divider"></div>
          <div class="palette" aria-label="メモの色">
            <button
              class="swatch"
              data-color="var(--color-white)"
              style="background: var(--color-white)"
              title="白"
              aria-label="白"
            ></button>
            <button
              class="swatch"
              data-color="var(--color-yellow-400)"
              style="background: var(--color-yellow-400)"
              title="黄色"
              aria-label="黄色"
            ></button
            ><button
              class="swatch"
              data-color="var(--color-red-300)"
              style="background: var(--color-red-300)"
              title="赤"
              aria-label="赤"
            ></button
            ><button
              class="swatch"
              data-color="var(--color-green-300)"
              style="background: var(--color-green-300)"
              title="緑"
              aria-label="緑"
            ></button
            ><button
              class="swatch"
              data-color="var(--color-blue-300)"
              style="background: var(--color-blue-300)"
              title="青"
              aria-label="青"
            ></button>
          </div>
          <div class="divider"></div>
          <button
            class="tool"
            id="delete"
            title="削除 (Delete)"
            aria-label="選択したメモを削除"
          >
            <svg viewBox="0 0 24 24">
              <path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 10v7M14 10v7" />
            </svg></button
          ><button
            id="new"
            class="quick-action"
            title="新しいボード（⌘Zで取り消し可能）"
            aria-label="新規ボード"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" /></svg
            ><span>新規</span>
          </button>
        </div>
      </nav>
      <div class="zoom" role="group" aria-label="表示倍率">
        <button id="minus" aria-label="縮小">−</button><span id="scale">100%</span
        ><button id="plus" aria-label="拡大">＋</button>
      </div>
    </div>
    <div
      id="editor"
      contenteditable="true"
      role="textbox"
      aria-multiline="true"
      aria-label="メモを編集"
      spellcheck="false"
    ></div>
    <div id="formatbar" role="toolbar" aria-label="文字の書式">
      <button data-format="bold" title="太字（⌘B / Ctrl+B）" aria-label="太字">
        <b>B</b></button
      ><button
        data-format="italic"
        title="斜体（⌘I / Ctrl+I）"
        aria-label="斜体"
      >
        <i>I</i></button
      ><button
        data-format="underline"
        title="下線（⌘U / Ctrl+U）"
        aria-label="下線"
      >
        <u>U</u></button
      ><button
        data-format="highlight"
        title="ハイライト（⌘Shift+H / Ctrl+Shift+H）"
        aria-label="ハイライト"
      >
        <span style="background: var(--color-yellow-300); padding: 0 2px"
          >H</span
        ></button
      ><button
        data-format="removeFormat"
        title="書式をクリア（⌘\ / Ctrl+\）"
        aria-label="書式をクリア"
      >
        T̸
      </button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      (() => {
        "use strict";

            ["arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)
          ) {
            if (selection.size) {
              if (!e.repeat) checkpoint();
              let d = e.shiftKey ? 10 : 1,
                dx = k === "arrowleft" ? -d : k === "arrowright" ? d : 0,
                dy = k === "arrowup" ? -d : k === "arrowdown" ? d : 0;
              chosen().forEach((n) => offset(n, dx, dy));
              render();
              save();
            }
          } else if (
            !mod &&
            !e.altKey &&
            { v: 1, r: 1, a: 1, l: 1, t: 1, h: 1 }[k]
          )
            choose(
              {
                v: "select",
                r: "rect",
                a: "arrow",
                l: "arrow",
                t: "text",
                h: "hand",
              }[k],
            );
          else handled = false;
          if (handled) e.preventDefault();
        }
        addEventListener("keyup", (e) => {
          if (e.code === "Space") {
            space = false;
            $("#canvas").style.cursor =
              tool === "hand"
                ? "grab"
                : tool === "select"
                  ? "default"
                  : "crosshair";
          }
        });
        addEventListener("blur", () => {
          space = false;
          release();
        });
        addEventListener("pagehide", () => {
          finishEdit();
          save();
        });
        $("#new").onclick = () => {
          finishEdit();
          checkpoint();
          nodes = [];
          color = "var(--color-white)";
          selection.clear();
          view = { x: 0, y: 0, z: 1 };
          gesture = null;
          guides = [];
          targetAnchor = null;
          choose("select");
          render();
          save();
        };
        // Startup. No network requests or external dependencies are required.
        $("#grab-layer").addEventListener("pointerdown", onBorderPointerDown);
        $("#canvas").addEventListener("pointerdown", onCanvasPointerDown);
        $("#canvas").addEventListener("pointermove", onCanvasPointerMove);
        addEventListener("keydown", onBoardKeyDown);
        loadBoard();
        render();
      })();
    </script>
  </body>
</html>
